server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: drone-rental

  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: org.sqlite.JDBC
    url: jdbc:sqlite:drone_rental.db
    druid:
      initial-size: 10
      min-idle: 5
      max-active: 50
      max-wait: 5000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      max-evictable-idle-time-millis: 600000
      validation-query: SELECT 1
      validation-query-timeout: 3
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 50
      filters: stat

  sql:
    init:
      mode: never
      schema-locations:
        - classpath:sql/init.sqlite.sql
      separator: ;

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 10000ms
      client-type: lettuce
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
          max-wait: -1ms

  ai:
    openai:
      # API Key：本地开发直接写死；生产部署请改为环境变量或密钥管理
      api-key: sk-your-dashscope-api-key-here
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      chat:
        options:
          model: qwen-plus
          temperature: 0.7
          max-tokens: 4096
          top-p: 0.9
          frequency-penalty: 0.0
          presence-penalty: 0.0
      embedding:
        options:
          model: text-embedding-v3
          dimensions: 1024
    # 向量存储使用自实现的 SimpleVectorStore（内存版，重启自动从知识库重建）
    # 已注释 Redis 配置，避免依赖 redis-modules/JSON.SET
    # vectorstore:
    #   redis:
    #     host: localhost
    #     port: 6379
    #     index: drone-rental-kb
    #     prefix: "drone:vector:"
    mcp:
      server:
        # MCP Server (WebMVC SSE Transport) - 把业务工具暴露为 MCP 协议
        # 任何 MCP 客户端（如 Claude Desktop、Cursor）可通过此端点使用我们的工具
        name: drone-rental-mcp
        version: 1.0.0
        type: SYNC
        sse-endpoint: /mcp/sse
        # 允许的 MCP 客户端来源（本地开发放行所有来源；生产部署时改为具体域名）
        allowed-origins: "*"

# CORS 跨域白名单：包含 Web（Vite 5173/5174）、H5（uni-app 3000）、后端（8080）
# 本地开发直接放行本地所有端口；生产部署时改为具体域名，多个用逗号分隔
cors:
  allowed-origins: http://localhost:5173,http://localhost:5174,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000,http://localhost:8080,http://127.0.0.1:8080,http://localhost:8081,http://127.0.0.1:8081

mybatis-plus:
  type-aliases-package: com.drone.rental.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

jwt:
  # JWT 签名密钥（本地开发默认值；生产部署请改为强随机字符串）
  secret: your-jwt-secret-here
  expiration: 86400000
  header: Authorization
  prefix: Bearer

springdoc:
  api-docs:
    enabled: true
    path: /api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui/index.html

file:
  upload-path: ../uploads/
  access-url: /uploads/

logging:
  level:
    com.drone.rental: info
    com.drone.rental.mapper: warn
    org.mybatis: warn
  pattern:
    console: "%d{HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"